<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193b31">
  <meta name="description" content="WINTER 的个人空间。在森林、草甸与阿尔卑斯山之间，向山野走去，和生活相遇。">
  <title>WINTER — 山野之间</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/swiss-alps.webp" as="image" media="(min-width: 761px)">
  <link rel="preload" href="assets/swiss-alps-small.webp" as="image" media="(max-width: 760px)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#cover-title">跳到封面文字</a>
  <main class="cover" id="main" data-view="cover" aria-labelledby="cover-title">
    <picture class="landscape">
      <source media="(max-width: 760px)" srcset="assets/swiss-alps-small.webp">
      <img src="assets/swiss-alps.webp" alt="瑞士格林德瓦的夏日：冰蓝色山峰下，松林环绕着一片柔软的绿色草甸。" width="2000" height="1335" fetchpriority="high" decoding="async">
    </picture>
    <div class="landscape-shade" aria-hidden="true"></div>
    <div class="cover-edge" aria-hidden="true"></div>

    <header class="cover-header">
      <a class="brand scene-copy" href="#main" aria-label="WINTER 首页">
        <svg class="brand-symbol" viewBox="0 0 38 32" fill="none" aria-hidden="true"><path d="m2 27 10-17 7 10 6-15 11 22H2Z"/><path d="m9 16 3 4 3-3m7-5 3 4 3-5"/></svg>
        <span>WINTER<span class="brand-period">.</span></span>
      </a>
      <span class="header-note scene-copy">A PERSONAL SPACE</span>
      <button class="view-toggle" id="view-toggle" type="button" aria-pressed="false" aria-label="隐藏文字，只看风景">
        <svg id="view-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg>
        <span id="view-label">只看风景</span>
      </button>
    </header>

    <div class="cover-copy scene-copy">
      <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span> MY LITTLE WILDERNESS</p>
      <h1 id="cover-title" tabindex="-1">WINTER</h1>
      <div class="cover-caption">
        <span class="caption-line" aria-hidden="true"></span>
        <p>向山野走去，和生活相遇。</p>
      </div>
    </div>

    <footer class="cover-footer scene-copy">
      <div class="footer-mood">
        <svg class="compass" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M24 1v7m23 16h-7M24 47v-7M1 24h7"/><path d="m29 14-3 12-12 3 3-12 12-3Z"/><path d="m29 14-12 3 9 9 3-12Z" fill="currentColor"/></svg>
        <span>TAKE A BREATH.<br><span>STAY A WHILE.</span></span>
      </div>
      <a class="photo-credit" href="https://unsplash.com/photos/6IEGjAhBnfU" target="_blank" rel="noopener noreferrer" aria-label="封面摄影：Polina Kocheva，瑞士格林德瓦。在 Unsplash 查看原图（新窗口）">
        <span class="photo-place"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 6.4c0 3.5-5 7.1-5 7.1S3 9.9 3 6.4a5 5 0 1 1 10 0Z"/><circle cx="8" cy="6" r="1.5"/></svg>GRINDELWALD, SWITZERLAND <span aria-hidden="true">↗</span></span>
        <span class="photo-author">Photo by Polina Kocheva / Unsplash</span>
      </a>
    </footer>
    <p id="view-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
